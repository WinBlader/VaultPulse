services:
  # ==========================================
  # 1. APACHE ZOOKEEPER
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: vaultpulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bda-net

  # ==========================================
  # 2. APACHE KAFKA BROKER
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: vaultpulse-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - bda-net

  # ==========================================
  # 3. APACHE HADOOP HDFS NAMENODE
  # ==========================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: vaultpulse-namenode
    environment:
      - CLUSTER_NAME=vaultpulse-bda-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9870:9870" # HDFS NameNode Web UI
      - "9000:9000" # HDFS RPC Port
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - bda-net

  # ==========================================
  # 4. APACHE HADOOP HDFS DATANODE
  # ==========================================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: vaultpulse-datanode
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9864:9864" # HDFS DataNode Web UI
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - bda-net

  # ==========================================
  # 5. VAULTPULSE AI APPLICATION
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultpulse-app
    depends_on:
      - kafka
      - namenode
      - datanode
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - HDFS_NAMENODE_URL=hdfs://namenode:9000
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./hdfs_storage:/app/hdfs_storage
      - ./forecasting:/app/forecasting
      - ./kafka_pipeline:/app/kafka_pipeline
      - ./dashboard:/app/dashboard
      - ./run_project.py:/app/run_project.py
    networks:
      - bda-net

volumes:
  hadoop_namenode:
  hadoop_datanode:

networks:
  bda-net:
    driver: bridge
